# Read by U-Boot distro boot from the bootable FAT partition.
# U-Boot v2024.01 am335x_evm runs "findfdt; init_console; finduuid;
# distro_bootcmd" and no longer imports uEnv.txt.
#
# root= uses the MBR disk id written by scripts/make-image.sh, which parses
# it from this line: change it here only.
default bbb

label bbb
	kernel /zImage
	fdt /am335x-boneblack-oled.dtb
	append console=ttyS0,115200n8 root=PARTUUID=bbb0a1ed-02 rw rootfstype=ext4 rootwait panic=10
